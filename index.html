<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Timer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --work: #E8FF47;
  --rest: #47FFDB;
  --idle: #ffffff;
  --bg: #0d0d0d;
  --text: #ffffff;
  --muted: #555;
  --phase-color: #ffffff;
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  touch-action: manipulation;
  min-height: 100%;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 0 80px;
}

.glow {
  position: fixed;
  width: 260px; height: 260px;
  border-radius: 50%;
  background: #ffffff;
  opacity: 0.06;
  filter: blur(70px);
  top: 180px; left: 50%;
  transform: translateX(-50%);
  transition: background 0.5s;
  pointer-events: none;
  z-index: 0;
}

.section {
  width: 100%;
  max-width: 480px;
  padding: 36px 24px 28px;
}

.section + .section {
  border-top: 1px solid #1a1a1a;
  padding-top: 28px;
}

.section-title {
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 24px;
}

.phase-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--phase-color);
  transition: color 0.3s;
  height: 16px;
  margin-bottom: 2px;
}

.timer-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.time-display {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(96px, 25vw, 144px);
  line-height: 0.88;
  color: var(--phase-color);
  transition: color 0.3s;
  text-align: center;
}

.counter-row {
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--muted);
  text-transform: uppercase;
}

.counter-row span { color: var(--text); }

.progress-wrap {
  width: 100%;
  height: 2px;
  background: #1e1e1e;
  border-radius: 2px;
  overflow: hidden;
  margin: 8px 0 2px;
}

.progress-bar {
  height: 100%;
  background: var(--phase-color);
  width: 100%;
  transition: background 0.3s;
}

.settings { width: 100%; display: flex; flex-direction: column; }

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 0;
  border-bottom: 1px solid #1a1a1a;
}

.setting-row:last-child { border-bottom: none; }

.setting-label {
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
}

.phase-dot {
  display: inline-block;
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

.setting-controls { display: flex; align-items: center; gap: 14px; }

.setting-value {
  font-size: 15px;
  font-weight: 500;
  min-width: 48px;
  text-align: center;
  color: var(--text);
}

.btn-adj {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 1px solid #2a2a2a;
  background: #1a1a1a;
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color 0.2s, background 0.2s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.btn-adj:active { background: #2a2a2a; border-color: #444; }

.btn-main {
  width: calc(100% - 48px);
  max-width: 432px;
  height: 58px;
  border-radius: 12px;
  border: none;
  background: var(--phase-color);
  color: #000;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.4s, opacity 0.15s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  margin-top: 8px;
}

.btn-main:active { opacity: 0.8; }

/* ── TEMPO ── */
.tempo-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.toggle {
  position: relative;
  width: 44px; height: 24px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
}

.toggle input { opacity: 0; width: 0; height: 0; position: absolute; }

.toggle-track {
  position: absolute;
  inset: 0;
  background: #2a2a2a;
  border-radius: 24px;
  transition: background 0.3s;
}

.toggle input:checked + .toggle-track { background: #E8FF47; }

.toggle-thumb {
  position: absolute;
  top: 3px; left: 3px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.3s;
  pointer-events: none;
}

.toggle input:checked ~ .toggle-thumb { transform: translateX(20px); }

.tempo-body {
  display: none;
  flex-direction: column;
  margin-top: 24px;
}

.tempo-body.open { display: flex; }

.phase-selector {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
}

.phase-btn {
  flex: 1;
  height: 34px;
  border-radius: 8px;
  border: 1px solid #2a2a2a;
  background: #1a1a1a;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.phase-btn.active {
  border-color: #E8FF47;
  color: #E8FF47;
  background: rgba(232,255,71,0.05);
}

/* Tempo run display */
.tempo-run {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 16px 0 4px;
}

.tempo-run.active { display: flex; }

.t-phase-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  transition: color 0.25s;
}

.t-time {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(86px, 22vw, 128px);
  line-height: 0.88;
  transition: color 0.25s;
  text-align: center;
}

.t-counter {
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--muted);
  text-transform: uppercase;
}

.t-counter span { color: var(--text); }

.pulse { animation: pulse 0.13s ease-out; }

@keyframes pulse {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.05); }
  100% { transform: scale(1); }
}

body.i-running .settings.i-settings,
body.t-running .settings.t-settings,
body.t-running .phase-selector { opacity: 0.2; pointer-events: none; transition: opacity 0.4s; }
</style>
</head>
<body>

<div class="glow" id="glow"></div>

<!-- ═══ INTERVAL TIMER ═══ -->

<div class="section">
  <div class="section-title">Interval Timer</div>
  <div class="phase-label" id="iPhaseLabel">READY</div>
  <div class="timer-block">
    <div class="time-display" id="iTime">30</div>
    <div class="counter-row">SET <span id="iCurSet">0</span>/<span id="iTotSets">8</span></div>
    <div class="progress-wrap"><div class="progress-bar" id="iBar"></div></div>
  </div>
  <div style="height:20px"></div>
  <div class="settings i-settings">
    <div class="setting-row">
      <span class="setting-label">Work</span>
      <div class="setting-controls">
        <button class="btn-adj" onclick="iAdj('work',-5)">−</button>
        <span class="setting-value" id="iWorkVal">30s</span>
        <button class="btn-adj" onclick="iAdj('work',5)">+</button>
      </div>
    </div>
    <div class="setting-row">
      <span class="setting-label">Rest</span>
      <div class="setting-controls">
        <button class="btn-adj" onclick="iAdj('rest',-5)">−</button>
        <span class="setting-value" id="iRestVal">15s</span>
        <button class="btn-adj" onclick="iAdj('rest',5)">+</button>
      </div>
    </div>
    <div class="setting-row">
      <span class="setting-label">Sets</span>
      <div class="setting-controls">
        <button class="btn-adj" onclick="iAdj('sets',-1)">−</button>
        <span class="setting-value" id="iSetsVal">8</span>
        <button class="btn-adj" onclick="iAdj('sets',1)">+</button>
      </div>
    </div>
  </div>
</div>

<button class="btn-main" id="iBtn" onclick="iToggle()">START</button>

<!-- ═══ TEMPO TIMER ═══ -->

<div class="section">
  <div class="tempo-header">
    <span class="section-title" style="margin:0">Tempo Timer</span>
    <label class="toggle">
      <input type="checkbox" id="tempoSwitch" onchange="tempoToggle()">
      <div class="toggle-track"></div>
      <div class="toggle-thumb"></div>
    </label>
  </div>

  <div class="tempo-body" id="tempoBody">
    <div class="phase-selector">
      <button class="phase-btn" id="pc2" onclick="setPC(2)">2 phases</button>
      <button class="phase-btn active" id="pc3" onclick="setPC(3)">3 phases</button>
      <button class="phase-btn" id="pc4" onclick="setPC(4)">4 phases</button>
    </div>

    <div class="settings t-settings" id="tPhaseRows"></div>
    <div style="height:12px"></div>
    <div class="settings t-settings">
      <div class="setting-row">
        <span class="setting-label">Reps per set</span>
        <div class="setting-controls">
          <button class="btn-adj" onclick="tAdj('reps',-1)">−</button>
          <span class="setting-value" id="tRepsVal">8</span>
          <button class="btn-adj" onclick="tAdj('reps',1)">+</button>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">Sets</span>
        <div class="setting-controls">
          <button class="btn-adj" onclick="tAdj('sets',-1)">−</button>
          <span class="setting-value" id="tSetsVal">3</span>
          <button class="btn-adj" onclick="tAdj('sets',1)">+</button>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">Rest between sets</span>
        <div class="setting-controls">
          <button class="btn-adj" onclick="tAdj('rest',-5)">−</button>
          <span class="setting-value" id="tRestVal">60s</span>
          <button class="btn-adj" onclick="tAdj('rest',5)">+</button>
        </div>
      </div>
    </div>

    <!-- Active run display -->
    <div class="tempo-run" id="tRunDisplay">
      <div class="t-phase-label" id="tPhaseLabel">DOWN</div>
      <div class="t-time" id="tTime">03</div>
      <div class="t-counter">
        REP <span id="tCurRep">1</span>/<span id="tTotReps">8</span>
        &nbsp;·&nbsp;
        SET <span id="tCurSet">1</span>/<span id="tTotSets">3</span>
      </div>
      <div class="progress-wrap" style="width:100%;margin-top:8px;">
        <div class="progress-bar" id="tBar" style="background:#FF6B6B"></div>
      </div>
    </div>

  </div>
</div>

<button class="btn-main" id="tBtn" onclick="tToggle()" style="display:none">START TEMPO</button>

<script>
// ── Audio ──────────────────────────────────
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
function audio() { if (!actx) actx = new AudioCtx(); return actx; }
function beep(f,d,v=0.3) {
  try {
    const c=audio(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(v,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);
    o.start(c.currentTime);o.stop(c.currentTime+d);
  } catch(e){}
}
const bWork=()=>{beep(880,.1);setTimeout(()=>beep(1100,.14),120);};
const bRest=()=>{beep(600,.14);setTimeout(()=>beep(420,.18),120);};
const bTick=()=>beep(1200,.06,.18);
const bDone=()=>{beep(660,.09);setTimeout(()=>beep(880,.09),110);setTimeout(()=>beep(1100,.28),220);};

function fmt(s){
  if(s>=60){const m=Math.floor(s/60),r=s%60;return r===0?`${m}:00`:`${m}:${String(r).padStart(2,'0')}`;}
  return String(s).padStart(2,'0');
}

function pulse(el){el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse');}

function setGlow(c){
  document.getElementById('glow').style.background=c;
  document.documentElement.style.setProperty('--phase-color',c);
}

// ── Interval Timer ─────────────────────────
const I={work:30,rest:15,sets:8,curSet:0,phase:'idle',left:30,total:30,iv:null,running:false};
const IC={idle:'#ffffff',work:'#E8FF47',rest:'#47FFDB',done:'#ffffff'};

function iDraw(){
  document.getElementById('iTime').textContent=fmt(I.left);
  const lbl={idle:'READY',work:'WORK',rest:'REST',done:'DONE'};
  document.getElementById('iPhaseLabel').textContent=lbl[I.phase]||'READY';
  document.getElementById('iCurSet').textContent=I.curSet;
  document.getElementById('iTotSets').textContent=I.sets;
  document.getElementById('iBar').style.width=(I.total>0?(I.left/I.total*100):100)+'%';
  const c=IC[I.phase]||'#fff';
  document.getElementById('iBar').style.background=c;
  document.getElementById('iPhaseLabel').style.color=c;
  document.getElementById('iTime').style.color=c;
  document.getElementById('iBtn').style.background=c;
  setGlow(c);
}

function iGo(phase){
  I.phase=phase;
  if(phase==='work'){I.curSet++;I.total=I.left=I.work;bWork();}
  else if(phase==='rest'){I.total=I.left=I.rest;bRest();}
  else if(phase==='done'){
    I.running=false;document.body.classList.remove('i-running');
    document.getElementById('iBtn').textContent='RESET';bDone();iDraw();return;
  }
  pulse(document.getElementById('iTime'));iDraw();
}

function iTick(){
  I.left--;
  if(I.left<=0){
    if(I.phase==='work') iGo(I.curSet<I.sets?'rest':'done');
    else if(I.phase==='rest') iGo('work');
  } else iDraw();
}

function iToggle(){
  if(I.phase==='done'||(!I.running&&I.phase==='idle')){
    clearInterval(I.iv);I.curSet=0;I.running=true;
    document.body.classList.add('i-running');
    document.getElementById('iBtn').textContent='STOP';
    iGo('work');I.iv=setInterval(iTick,1000);return;
  }
  if(I.running){
    clearInterval(I.iv);I.running=false;
    document.body.classList.remove('i-running');
    document.getElementById('iBtn').textContent='RESUME';
  } else {
    I.running=true;document.body.classList.add('i-running');
    document.getElementById('iBtn').textContent='STOP';
    I.iv=setInterval(iTick,1000);
  }
}

function iAdj(k,d){
  if(I.running)return;
  if(k==='work')I.work=Math.max(5,I.work+d);
  if(k==='rest')I.rest=Math.max(5,I.rest+d);
  if(k==='sets')I.sets=Math.max(1,I.sets+d);
  document.getElementById('iWorkVal').textContent=fmt(I.work);
  document.getElementById('iRestVal').textContent=fmt(I.rest);
  document.getElementById('iSetsVal').textContent=I.sets;
  if(I.phase==='idle'||I.phase==='done'){
    I.phase='idle';I.left=I.work;I.total=I.work;I.curSet=0;
    document.getElementById('iBtn').textContent='START';iDraw();
  }
}

// ── Tempo Timer ────────────────────────────
const PHASES=[
  {key:'down', label:'DOWN',  color:'#FF6B6B'},
  {key:'hold', label:'HOLD',  color:'#FFB347'},
  {key:'up',   label:'UP',    color:'#69FF84'},
  {key:'hold2',label:'HOLD',  color:'#B47FFF'},
];

const T={pc:3,dur:[3,3,3,3],reps:8,sets:3,rest:60,
         curRep:0,curSet:0,curP:0,left:0,total:0,
         phase:'idle',iv:null,running:false};

function tempoToggle(){
  const on=document.getElementById('tempoSwitch').checked;
  document.getElementById('tempoBody').classList.toggle('open',on);
  document.getElementById('tBtn').style.display=on?'block':'none';
  if(on)buildPhaseRows();
}

function setPC(n){
  T.pc=n;
  ['pc2','pc3','pc4'].forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById('pc'+n).classList.add('active');
  buildPhaseRows();
}

function buildPhaseRows(){
  const c=document.getElementById('tPhaseRows');
  c.innerHTML='';
  PHASES.slice(0,T.pc).forEach((p,i)=>{
    const row=document.createElement('div');
    row.className='setting-row';
    row.innerHTML=`
      <span class="setting-label">
        <span class="phase-dot" style="background:${p.color}"></span>${p.label}
      </span>
      <div class="setting-controls">
        <button class="btn-adj" onclick="tPhAdj(${i},-1)">−</button>
        <span class="setting-value" id="tD${i}">${T.dur[i]}s</span>
        <button class="btn-adj" onclick="tPhAdj(${i},1)">+</button>
      </div>`;
    c.appendChild(row);
  });
}

function tPhAdj(i,d){
  if(T.running)return;
  T.dur[i]=Math.max(1,T.dur[i]+d);
  document.getElementById('tD'+i).textContent=T.dur[i]+'s';
}

function tAdj(k,d){
  if(T.running)return;
  if(k==='reps')T.reps=Math.max(1,T.reps+d);
  if(k==='sets')T.sets=Math.max(1,T.sets+d);
  if(k==='rest')T.rest=Math.max(5,T.rest+d);
  document.getElementById('tRepsVal').textContent=T.reps;
  document.getElementById('tSetsVal').textContent=T.sets;
  document.getElementById('tRestVal').textContent=fmt(T.rest);
}

function tDraw(){
  let label,color;
  if(T.phase==='rest'){label='REST';color='#47FFDB';}
  else if(T.phase==='done'){label='DONE';color='#ffffff';}
  else{const p=PHASES[T.curP];label=p.label;color=p.color;}
  const tpl=document.getElementById('tPhaseLabel');
  const ttm=document.getElementById('tTime');
  tpl.textContent=label;tpl.style.color=color;
  ttm.textContent=fmt(T.left);ttm.style.color=color;
  document.getElementById('tCurRep').textContent=T.curRep;
  document.getElementById('tTotReps').textContent=T.reps;
  document.getElementById('tCurSet').textContent=T.curSet;
  document.getElementById('tTotSets').textContent=T.sets;
  document.getElementById('tBar').style.width=(T.total>0?(T.left/T.total*100):100)+'%';
  document.getElementById('tBar').style.background=color;
}

function tGoPhase(pi){
  T.curP=pi;T.phase='rep';
  T.total=T.left=T.dur[pi];
  bTick();
  pulse(document.getElementById('tTime'));
  tDraw();
}

function tGoRest(){
  T.phase='rest';T.total=T.left=T.rest;bRest();
  pulse(document.getElementById('tTime'));tDraw();
}

function tTick(){
  T.left--;
  if(T.left<=0){
    if(T.phase==='rest'){T.curSet++;T.curRep=1;tGoPhase(0);return;}
    const next=T.curP+1;
    if(next<T.pc){tGoPhase(next);return;}
    // rep done
    if(T.curRep<T.reps){T.curRep++;tGoPhase(0);return;}
    // set done
    if(T.curSet<T.sets){tGoRest();return;}
    // all done
    T.running=false;T.phase='done';clearInterval(T.iv);
    document.body.classList.remove('t-running');
    document.getElementById('tBtn').textContent='RESET TEMPO';
    bDone();tDraw();
    document.getElementById('tRunDisplay').classList.remove('active');
  } else tDraw();
}

function tToggle(){
  if(T.phase==='done'||(!T.running&&T.phase==='idle')){
    clearInterval(T.iv);T.curRep=1;T.curSet=1;T.running=true;
    document.body.classList.add('t-running');
    document.getElementById('tBtn').textContent='STOP';
    document.getElementById('tRunDisplay').classList.add('active');
    tGoPhase(0);T.iv=setInterval(tTick,1000);return;
  }
  if(T.running){
    clearInterval(T.iv);T.running=false;
    document.body.classList.remove('t-running');
    document.getElementById('tBtn').textContent='RESUME';
  } else {
    T.running=true;document.body.classList.add('t-running');
    document.getElementById('tBtn').textContent='STOP';
    T.iv=setInterval(tTick,1000);
  }
}

// init
iDraw();
buildPhaseRows();
document.getElementById('tRestVal').textContent=fmt(T.rest);
</script>

</body>
</html>
